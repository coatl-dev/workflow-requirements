name: test

on:
  pull_request:
    branches:
      - coatl
    paths:
      - .github/workflows/test.yml
      - requirements/**

jobs:
  test:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        id: setup-python

      - name: Dry run pip install
        shell: bash
        working-directory: requirements
        run: |
          for file in *.txt; do
            if [ -f "$file" ]; then
              python -m pip install --dry-run --requirement "$file"
            fi
          done
